domainFilters:
  - devpi.de
extraArgs:
  - --rfc2136-host=10.10.0.1
  - --rfc2136-port=53530
  - --rfc2136-zone=devpi.de
  - --rfc2136-tsig-keyname=rndc-key
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-tsig-axfr
policy: sync
provider:
  name: rfc2136
env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom:
      secretKeyRef:
        name: external-dns-bind-secret
        key: tsig_secret
resources:
  requests:
    cpu: 16m
    memory: 90M
  limits:
    memory: 90M
sources:
  - service
  - gateway-httproute
triggerLoopOnEvent: true
txtOwnerId: main
txtPrefix: "k8s."
