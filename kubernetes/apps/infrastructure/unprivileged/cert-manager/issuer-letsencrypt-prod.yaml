apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  namespace: cert-manager
spec:
  acme:
    privateKeySecretRef:
      name: letsencrypt-prod
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          webhook:
            groupName: acme.pr0ton11.github.com
            solverName: desec
            config:
              apiKeySecretRef:
                name: desec-api-token
                key: DESEC_TOKEN
          cnameStrategy: Follow
        selector:
          dnsZones:
            - devpi.de
