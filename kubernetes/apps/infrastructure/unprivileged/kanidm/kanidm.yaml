---
apiVersion: kaniop.rs/v1beta1
kind: Kanidm
metadata:
  name: sso
spec:
  domain: idm.devpi.de
  origin: https://idm.devpi.de

  image: kanidm/server:1.12.0
  logLevel: info

  replicaGroups:
    - name: default
      replicas: 1
      primaryNode: true
      resources:
        requests:
          cpu: 10m
        limits:
          memory: 512Mi
      role: write_replica

  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-backup
        resources:
          requests:
            storage: 2Gi

  tlsSecretName: idm-devpi-de-tls

  gateway:
    parentRefs:
      - name: web-internal
        namespace: cilium
        sectionName: https
    hostnames:
      - idm.devpi.de
    backendTlsPolicy:
      validation:
        hostname: idm.devpi.de
        wellKnownCaCertificates: System

  # Allow identity resources (groups, people, OAuth2 clients, service accounts)
  # to be declared from any namespace, so applications can own their SSO setup.
  groupNamespaceSelector: {}
  oauth2ClientNamespaceSelector: {}
  serviceAccountNamespaceSelector: {}
