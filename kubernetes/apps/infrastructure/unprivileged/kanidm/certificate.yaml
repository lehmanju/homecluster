---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: idm-devpi-de
spec:
  secretName: idm-devpi-de-tls
  dnsNames:
    - '*.devpi.de'
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
