---
# Advertise service LoadBalancer IPs as /32 routes (no aggregation; v2 caps aggregation at /31)
apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: bgp-advertisements
  labels:
    advertise: "loadbalancer-ip"
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: somekey
            operator: NotIn
            values:
              - never-used-value
---
apiVersion: cilium.io/v2
kind: CiliumBGPPeerConfig
metadata:
  name: opnsense
spec:
  transport:
    peerPort: 179
  families:
    - afi: ipv4
      safi: unicast
      advertisements:
        matchLabels:
          advertise: "loadbalancer-ip"
---
apiVersion: cilium.io/v2
kind: CiliumBGPClusterConfig
metadata:
  name: cilium-bgp
spec:
  # nodeSelector omitted → applies to all nodes (new nodes peer automatically)
  bgpInstances:
    - name: instance-1
      localASN: 65000
      peers:
        - name: opnsense
          peerAddress: 192.168.1.1
          peerASN: 65001
          peerConfigRef:
            name: opnsense
