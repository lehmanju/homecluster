---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: iot
spec:
  config: |-
    {
      "cniVersion": "0.3.1",
      "name": "iot",
      "plugins": [
        {
          "type": "macvlan",
          "master": "bond0.1",
          "mode": "bridge",
          "capabilities": {
            "ips": true,
            "mac": true
          },
          "ipam": {
            "type": "static",
            "routes": [
              {"dst": "0.0.0.0/0", "gw": "192.168.1.1"}
            ]
          }
        },
        {
          "type": "sbr"
        }
      ]
    }
