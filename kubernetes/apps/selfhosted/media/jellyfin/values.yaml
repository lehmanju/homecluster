# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
controllers:
  jellyfin:
    annotations:
      reloader.stakater.com/auto: "true"
    pod:
      resourceClaims:
        - name: gpu
          resourceClaimName: amd-gpu
      # jellyfin/jellyfin#17831: default 30s can SIGKILL the shutdown VACUUM+ANALYZE on v12
      terminationGracePeriodSeconds: 120
    containers:
      app:
        image:
          repository: ghcr.io/jellyfin/jellyfin
          tag: 12.1@sha256:008ec8024bdaaa6f0a3f0de468e185633eeba9d67c56936e8dbf5ef6b8d6200f
        env:
          TZ: Europe/Berlin
          DOTNET_SYSTEM_IO_DISABLEFILELOCKING: "true"
          JELLYFIN_PublishedServerUrl: https://jellyfin.devpi.de
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: &port 8096
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *port
              periodSeconds: 10
              failureThreshold: 30
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 4Gi
          claims:
            - name: gpu
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    supplementalGroups: [44, 105]
service:
  app:
    controller: jellyfin
    ports:
      http:
        port: *port
route:
  app:
    hostnames: ["jellyfin.devpi.de", "media.devpi.de"]
    parentRefs:
      - name: web-internal
        namespace: cilium
        sectionName: https
    rules:
      - backendRefs:
          - identifier: app
            port: *port
        matches:
          - path:
              type: PathPrefix
              value: /
persistence:
  config:
    existingClaim: jellyfin
    globalMounts:
      - path: /config
  config-cache:
    existingClaim: jellyfin-cache
    globalMounts:
      - path: /config/metadata
  media:
    existingClaim: media
    globalMounts:
      - path: /media
        readOnly: true
  tmpfs:
    type: custom
    volumeSpec:
      name: jellyfin-ephemeral
      ephemeral:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: "longhorn-ephemeral"
            resources:
              requests:
                storage: 40Gi
    advancedMounts:
      jellyfin:
        app:
          - path: /cache
            subPath: cache
          - path: /tmp
            subPath: tmp
          - path: /transcode
            subPath: transcode
          - path: /config/log
            subPath: logs
