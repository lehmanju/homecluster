controllers:
  qbittorrent:
    initContainers:
      coredns:
        image:
          repository: mirror.gcr.io/coredns/coredns
          tag: 1.15.0
        args:
          - -conf
          - /etc/coredns/Corefile
        restartPolicy: Always

      gluetun:
        dependsOn:
          - coredns
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.3
        env:
          DOT: "off"
          DNS_ADDRESS: "127.0.0.2"
          VPN_SERVICE_PROVIDER: airvpn
          VPN_TYPE: wireguard
          SERVER_COUNTRIES: "Germany,Netherlands,Belgium,Austria,Switzerland,Czech Republic"
          FIREWALL_INPUT_PORTS: 8080,3000
          FIREWALL_OUTBOUND_SUBNETS: 10.245.0.0/16,10.244.0.0/16 # Allow access to k8s subnets
        envFrom:
          - secretRef:
              name: qbittorrent-secret
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - (ip rule del table 51820; ip -6 rule del table 51820) || true
        resources:
          requests:
            squat.ai/tun: "1"
          limits:
            squat.ai/tun: "1"
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_ADMIN

    containers:
      app:
        nameOverride: qbittorrent
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
        env:
          TZ: Europe/Berlin
          QBT_WEBUI_PORT: &qbit_port 8080
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2Gi

  qui:
    containers:
      app:
        image:
          repository: ghcr.io/autobrr/qui
          tag: v1.35.0@sha256:a5b2f5faf6388cce257137c88e4b189458fd799cf9119ed476c980e5a69341b2
        env:
          TZ: Europe/Berlin
          QUI__HOST: 0.0.0.0
          QUI__PORT: &qui_port 7476
          QUI__AUTH_DISABLED: "true"
          QUI__I_ACKNOWLEDGE_THIS_IS_A_BAD_IDEA: "true"
          QUI__AUTH_DISABLED_ALLOWED_CIDRS: 0.0.0.0/0
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: /health
                port: *qui_port
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000

defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: qbittorrent
    forceRename: qbittorrent
    ports:
      http:
        port: *qbit_port

  qui:
    controller: qui
    ports:
      http:
        port: *qui_port

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn-backup
    advancedMounts:
      qbittorrent:
        app:
          - path: /config
  downloads:
    existingClaim: media
    globalMounts:
      - path: /media/Downloads/qbittorrent
        subPath: Downloads/qbittorrent
  coredns:
    type: configMap
    identifier: qbittorrent-coredns
    advancedMounts:
      qbittorrent:
        coredns:
          - path: /etc/coredns/Corefile
            subPath: Corefile
            readOnly: true
  qui-config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn-backup
    advancedMounts:
      qui:
        app:
          - path: /config
route:
  app:
    hostnames:
      - qbittorrent.devpi.de
      - qb.devpi.de
      - download.devpi.de
    parentRefs:
      - name: web-internal
        namespace: cilium
        sectionName: https
    rules:
      - backendRefs:
          - identifier: qui
            port: *qui_port
        matches:
          - path:
              type: PathPrefix
              value: /

configMaps:
  qbittorrent-coredns:
    data:
      Corefile: |
        .:53 {
            bind 127.0.0.2
            rewrite stop type AAAA A
            errors
            health :8081 {
                lameduck 5s
            }
            log {
                class error
            }
            forward . tls://9.9.9.9 tls://149.112.112.112 {
                tls_servername dns.quad9.net
                health_check 5s
            }
            reload
        }

        cluster.local:53 {
            bind 127.0.0.2
            rewrite stop type AAAA A
            errors
            log {
                class error
            }
            forward . 10.245.0.10
        }
