controllers:
  qbittorrent:
    initContainers:
      coredns:
        image:
          repository: mirror.gcr.io/coredns/coredns
          tag: 1.15.0
        args:
          - -conf
          - /etc/coredns/Corefile
        restartPolicy: Always

      gluetun:
        dependsOn:
          - coredns
        image:
          repository: ghcr.io/qdm12/gluetun
          tag: v3.41.3
        env:
          DOT: "off"
          DNS_ADDRESS: "127.0.0.2"
          VPN_SERVICE_PROVIDER: airvpn
          VPN_TYPE: wireguard
          SERVER_COUNTRIES: "Germany,Netherlands,Belgium,Austria,Switzerland,Czech Republic"
          FIREWALL_INPUT_PORTS: 8080,3000
          FIREWALL_OUTBOUND_SUBNETS: 10.245.0.0/16,10.244.0.0/16 # Allow access to k8s subnets
        envFrom:
          - secretRef:
              name: qbittorrent-secret
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - |
                  (ip rule del table 51820; ip -6 rule del table 51820) || true
                  (
                    i=0
                    while [ "$i" -lt 60 ]; do
                      if wget -q -O- \
                        --post-data "json={\"listen_port\":${FIREWALL_VPN_INPUT_PORTS}}" \
                        "http://127.0.0.1:8080/api/v2/app/setPreferences"; then
                        exit 0
                      fi
                      i=$((i + 1))
                      sleep 5
                    done
                  ) &
        resources:
          requests:
            squat.ai/tun: "1"
          limits:
            squat.ai/tun: "1"
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_ADMIN

    containers:
      app:
        nameOverride: qbittorrent
        image:
          repository: ghcr.io/home-operations/qbittorrent
          tag: 5.3.0@sha256:5a858e61f94cf2712391db32ed03556576c700858f3e62c4c6fcde262443ebd8
        env:
          TZ: Europe/Berlin
          QBT_WEBUI_PORT: &qbit_port 8080
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: { drop: ["ALL"] }
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        resources:
          requests:
            cpu: 100m
          limits:
            memory: 2Gi

  vuetorrent:
    containers:
      app:
        image:
          repository: ghcr.io/vuetorrent/vuetorrent-backend
          tag: 2.7.4@sha256:8887bd34b17396543c8374dcf2ab98af4c7deb24b24889cbc47742b3d56e4adc
        env:
          QBIT_BASE: http://qbittorrent.media.svc.cluster.local:8080
          PORT: &vue_port 3000
          SKIP_X_FORWARD_HEADERS: true
        probes:
          liveness:
            enabled: true
          readiness:
            enabled: true
          startup:
            enabled: true
            spec:
              failureThreshold: 30
              periodSeconds: 10
        resources:
          requests:
            cpu: 10m
          limits:
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: { drop: ["ALL"] }

defaultPodOptions:
  securityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

service:
  app:
    controller: qbittorrent
    forceRename: qbittorrent
    ports:
      http:
        port: *qbit_port

  ui:
    controller: vuetorrent
    ports:
      http:
        port: *vue_port

persistence:
  config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn-backup
    advancedMounts:
      qbittorrent:
        app:
          - path: /config
  downloads:
    existingClaim: media
    globalMounts:
      - path: /media/Downloads/qbittorrent
        subPath: Downloads/qbittorrent
  coredns:
    type: configMap
    identifier: qbittorrent-coredns
    advancedMounts:
      qbittorrent:
        coredns:
          - path: /etc/coredns/Corefile
            subPath: Corefile
            readOnly: true
  vuetorrent-config:
    type: persistentVolumeClaim
    accessMode: ReadWriteOnce
    size: 5Gi
    storageClass: longhorn-backup
    advancedMounts:
      qbittorrent:
        vuetorrent:
          - path: /config
route:
  app:
    hostnames:
      - qbittorrent.devpi.de
      - qb.devpi.de
      - download.devpi.de
    parentRefs:
      - name: web-internal
        namespace: cilium
        sectionName: https
    rules:
      - backendRefs:
          - identifier: ui
            port: *vue_port
        matches:
          - path:
              type: PathPrefix
              value: /

configMaps:
  qbittorrent-coredns:
    data:
      Corefile: |
        .:53 {
            bind 127.0.0.2
            rewrite stop type AAAA A
            errors
            health :8081 {
                lameduck 5s
            }
            log {
                class error
            }
            forward . tls://9.9.9.9 tls://149.112.112.112 {
                tls_servername dns.quad9.net
                health_check 5s
            }
            reload
        }

        cluster.local:53 {
            bind 127.0.0.2
            rewrite stop type AAAA A
            errors
            log {
                class error
            }
            forward . 10.245.0.10
        }
